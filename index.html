*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;}
html,body{width:100%;min-height:100%;background:linear-gradient(135deg,#e8f4fd,#f0f8ff);font-family:-apple-system,'Apple SD Gothic Neo',Arial,sans-serif;}
#wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;

/* 헤더 */
#hdr{width:100%;text-align:center;}
#hdr h1{font-size:22px;font-weight:900;color:#1a2a5e;margin-bottom:3px;}
#hdr p{font-size:12px;color:rgba(80,100,160,0.6);}

/* 날씨 카드 */
.card{width:100%;background:#fff;border-radius:18px;padding:16px;
  box-shadow:0 3px 16px rgba(100,130,200,0.12);border:1px solid rgba(100,130,200,0.09);}
.card-title{font-size:11px;font-weight:700;color:rgba(80,100,160,0.5);

/* 날씨 */
.w-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
#w-icon{font-size:44px;line-height:1;}
.w-right{text-align:right;}
#w-temp{font-size:34px;font-weight:900;color:#1a2a5e;line-height:1;}
#w-feel{font-size:11px;color:rgba(80,100,160,0.55);margin-top:2px;}
#w-desc{font-size:13px;font-weight:700;color:#3498db;margin-top:2px;}
#w-loc{font-size:11px;color:rgba(80,100,160,0.45);margin-top:2px;}
.w-chips{display:flex;gap:6px;}
.w-chip{flex:1;background:#f5f7ff;border-radius:10px;padding:5px 6px;text-align:center;}
.w-chip-l{font-size:9px;color:rgba(80,100,160,0.5);letter-spacing:.4px;}
.w-chip-v{font-size:12px;font-weight:700;color:#1a2a5e;margin-top:1px;}
#w-loading{text-align:center;padding:16px;color:rgba(80,100,160,0.45);font-size:12px;}
#w-err{display:none;text-align:center;padding:10px;}
#btn-seoul{margin-top:6px;padding:7px 16px;border-radius:20px;
  border:1px solid rgba(100,130,200,0.25);background:#f5f7ff;
  color:#3498db;font-size:12px;cursor:pointer;}

/* 운세 입력 */
#fortune-form{width:100%;}
.f-label{font-size:12px;font-weight:700;color:#1a2a5e;margin-bottom:6px;display:block;}
.f-row{display:flex;gap:8px;align-items:center;}
.f-input{flex:1;padding:11px 14px;border-radius:12px;

  font-size:15px;color:#1a2a5e;outline:none;
  -webkit-appearance:none;text-align:center;}
.f-input:focus{border-color:#9b59b6;}
#btn-fortune{padding:11px 20px;border-radius:12px;border:none;

  font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;}
.f-hint{font-size:10px;color:rgba(80,100,160,0.4);margin-top:5px;}

.fortune-mini{background:linear-gradient(135deg,rgba(155,89,182,0.08),rgba(142,68,173,0.05));

.fortune-mini-name{font-size:13px;font-weight:700;color:#1a2a5e;}
.fortune-mini-star{font-size:12px;color:#f39c12;}
.fortune-bars{display:grid;grid-template-columns:1fr 1fr;gap:5px;}
.f-bar-row{display:flex;align-items:center;gap:6px;}
.f-bar-lbl{font-size:10px;color:rgba(80,100,160,0.55);width:28px;flex-shrink:0;}
.f-bar-bg{flex:1;height:5px;background:rgba(100,130,200,0.12);border-radius:3px;overflow:hidden;}
.f-bar-fill{height:100%;border-radius:3px;transition:width .5s;}
.f-bar-val{font-size:10px;font-weight:700;color:#9b59b6;width:16px;text-align:right;flex-shrink:0;}

.result-comment strong{color:#1a2a5e;}

.mtag{font-size:10px;border-radius:20px;padding:2px 8px;font-weight:600;}
.mtag-weather{background:rgba(52,152,219,0.12);color:#2980b9;}
.mtag-fortune{background:rgba(155,89,182,0.12);color:#8e44ad;}

#menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:10px;}

.menu-card:active{transform:scale(0.96);}
.menu-card.picked{border-color:#9b59b6;box-shadow:0 2px 14px rgba(155,89,182,0.22);}
.menu-card.highlight{border-color:#f39c12;box-shadow:0 2px 14px rgba(243,156,18,0.2);}
.m-emoji{font-size:30px;margin-bottom:5px;display:block;}
.m-name{font-size:13px;font-weight:700;color:#1a2a5e;}
.m-desc{font-size:9px;color:rgba(80,100,160,0.45);margin-top:2px;line-height:1.4;}
.m-why{font-size:10px;color:#9b59b6;margin-top:4px;font-weight:600;line-height:1.4;}
.m-badge{position:absolute;top:7px;right:7px;

.badge-weather{background:rgba(52,152,219,0.15);color:#2980b9;}
.badge-fortune{background:rgba(155,89,182,0.15);color:#8e44ad;}

.badge-popular{background:rgba(243,156,18,0.15);color:#e67e22;}

#footer{margin-top:auto;padding-top:12px;text-align:center;}

      <div style="display:flex;align-items:center;gap:8px;margin-top:8px;">

      </div>

    </div>

      <div class="fortune-mini">
        <div class="fortune-mini-top">

          <div class="fortune-mini-star" id="f-star">★★★★☆</div>

          <div class="f-bar-row"><span class="f-bar-lbl">금전</span><div class="f-bar-bg"><div class="f-bar-fill" id="fb-money" style="background:#f39c12;"></div></div><span class="f-bar-val" id="fv-money">-</span></div>

    </div>
    <div id="menu-grid"></div>
    <button id="btn-shuffle" onclick="shuffle()">🎲 다른 메뉴 추천받기</button>
    <button id="btn-reset" onclick="resetFortune()">↺ 생년월일 다시 입력</button>
  </div>

  <div id="footer">
    <a href="https://mindweaver74.github.io/Jutopia">🎮 Jutopia</a>

  </div>
</div>

function lunarToSolar(ly, lm, ld) {
  var data = LUNAR_DATA[ly];
  if (!data) return null; // 범위 밖
  var solarMonth = data[0], solarDay = data[1];
  var months = data[2];
  // 음력 1월 1일의 양력 날짜 기준으로 일수 계산
  var base = new Date(ly, solarMonth-1, solarDay);
  var offset = 0;
  for (var m = 1; m < lm; m++) {
    offset += months[m-1] || 29;
  }
  offset += ld - 1;
  var result = new Date(base.getTime() + offset * 86400000);
  return {
    year: result.getFullYear(),
    month: result.getMonth()+1,
    day: result.getDate()
  };
}

// ── 운세 계산 ──
function calcFortune() {
  var raw = document.getElementById('birth-input').value.replace(/\D/g,'');
  if (raw.length < 6) { alert('생년월일을 6자리 이상 입력해주세요'); return; }

  var year  = parseInt(raw.slice(0,4)) || 1990;
  var month = parseInt(raw.slice(4,6)) || 1;
  var day   = parseInt(raw.slice(6,8)) || 1;

  // 음력 체크
  var isLunar = document.getElementById('lunar-check').checked;
  if (isLunar) {
    var converted = lunarToSolar(year, month, day);
    if (converted) {
      year = converted.year; month = converted.month; day = converted.day;
      document.getElementById('lunar-converted').style.display = 'inline';
      document.getElementById('lunar-converted').textContent =
        '→ 양력 ' + year + '년 ' + month + '월 ' + day + '일';
    } else {
      // 변환 불가 시 원본 그대로
      document.getElementById('lunar-converted').style.display = 'inline';
      document.getElementById('lunar-converted').textContent = '(변환 데이터 없음 — 원본 사용)';
    }
  }

  var today = new Date();
  var seed  = year * 10000 + month * 100 + day +
              today.getFullYear() * 365 + today.getMonth() * 31 + today.getDate();

  function rng(s){ s=(s^(s>>16))*0x45d9f3b; s=(s^(s>>16))*0x45d9f3b; return (s^(s>>16))>>>0; }
  var r1=rng(seed), r2=rng(seed+1), r3=rng(seed+2), r4=rng(seed+3);
  var total  = 40 + (r1%55);
  var money  = 35 + (r2%60);
  var health = 40 + (r3%55);
  var love   = 35 + (r4%60);

  fortuneData = {total,money,health,love};

  // 운세 UI 표시
  document.getElementById('fortune-form').style.display='none';
  document.getElementById('fortune-result').style.display='block';

  document.getElementById('f-name').textContent = year+'년생';

  var stars = Math.round(total/20);
  document.getElementById('f-star').textContent = '★'.repeat(stars) + '☆'.repeat(5-stars);

  function setBar(id,vid,val){
    document.getElementById(id).style.width = val+'%';
    document.getElementById(vid).textContent = val;
    setTimeout(function(){ document.getElementById(id).style.width = val+'%'; },100);
  }
  setBar('fb-total','fv-total',total);
  setBar('fb-money','fv-money',money);
  setBar('fb-health','fv-health',health);
  setBar('fb-love','fv-love',love);

  // 결과가 둘 다 있으면 추천
  if (weatherState) showResult();
}

function getWeatherState(code, temp) {
  if ([61,63,65,66,67,80,81,82].includes(code)) return 'rainy';
  if ([71,73,75,77,85,86].includes(code)) return 'snowy';
  if (code >= 95) return 'rainy';
  if ([3,45,48].includes(code)) return 'cloudy';
  if (code >= 1 && code <= 2) return temp>=25?'hot':temp>=15?'mild':'cold';
  if (code === 0) return temp>=25?'hot':temp>=15?'mild':'cold';
  return temp>=25?'hot':temp>=15?'mild':'cold';
}

function loadWeather(lat, lon, locName) {
  var url = 'https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+
    '&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,cloud_cover'+
    '&timezone=Asia%2FSeoul&forecast_days=1';
  fetch(url).then(function(r){return r.json();}).then(function(d){
    var c = d.current;
    var temp  = Math.round(c.temperature_2m);
    var feel  = Math.round(c.apparent_temperature);
    var code  = c.weather_code;
    weatherTemp  = temp;
    weatherState = getWeatherState(code, temp);

    document.getElementById('w-loading').style.display='none';
    document.getElementById('w-main').style.display='block';
    document.getElementById('w-icon').textContent = WEATHER_ICONS[code]||'🌤️';
    document.getElementById('w-desc').textContent = (WEATHER_DESC[code]||'맑음')+(temp>=30?' (폭염)':temp<=0?' (영하)':'');
    document.getElementById('w-loc').textContent  = '📍 '+(locName||'현재 위치');
    document.getElementById('w-temp').textContent = temp+'°';
    document.getElementById('w-feel').textContent = '체감 '+feel+'°';
    document.getElementById('w-hum').textContent  = c.relative_humidity_2m+'%';
    document.getElementById('w-wind').textContent = (c.wind_speed_10m/3.6).toFixed(1)+'m/s';
    document.getElementById('w-cloud').textContent= c.cloud_cover+'%';

    // 동적 배경
    var bgMap={hot:'linear-gradient(135deg,#fff3e0,#fce4ec)',mild:'linear-gradient(135deg,#e8f5e9,#e3f2fd)',
      cold:'linear-gradient(135deg,#e3f2fd,#e8eaf6)',rainy:'linear-gradient(135deg,#eceff1,#e0e0e0)',
      snowy:'linear-gradient(135deg,#e8eaf6,#f3e5f5)',cloudy:'linear-gradient(135deg,#f5f5f5,#eceff1)'};
    document.body.style.background = bgMap[weatherState]||bgMap.mild;

    if (fortuneData) showResult();
  }).catch(function(){ showWeatherErr(); });
}

function showWeatherErr(){
  document.getElementById('w-loading').style.display='none';
  document.getElementById('w-err').style.display='block';
}
function useSeoul(){
  document.getElementById('w-err').style.display='none';
  document.getElementById('w-loading').style.display='block';
  loadWeather(37.5665,126.9780,'서울');
}
function getLocName(lat,lon,cb){
  fetch('https://nominatim.openstreetmap.org/reverse?lat='+lat+'&lon='+lon+'&format=json&accept-language=ko',
    {headers:{'User-Agent':'Jutopia/1.0'}})
    .then(function(r){return r.json();})
    .then(function(d){var a=d.address||{};cb(a.city||a.town||a.county||'');})
    .catch(function(){cb('');});
}
function getLocation(){
  if(!navigator.geolocation){useSeoul();return;}
  navigator.geolocation.getCurrentPosition(
    function(p){getLocName(p.coords.latitude,p.coords.longitude,function(n){loadWeather(p.coords.latitude,p.coords.longitude,n);});},
    function(){showWeatherErr();},{timeout:8000});
}

function scoreMenu(menu, wState, fTags){
  var score=0;
  var wMatch = menu.weatherTags.includes(wState);
  var fMatch = menu.fortuneTags.some(function(t){return fTags.includes(t);});
  if(wMatch) score+=3;
  if(fMatch) score+=2;
  if(wMatch&&fMatch) score+=3; // 둘 다 맞으면 보너스
  score += Math.random()*1.5; // 랜덤 요소
  return {score,wMatch,fMatch};
}

  var scored = MENUS.map(function(m){
    var s = scoreMenu(m, weatherState, fTags);
    return {menu:m, score:s.score, wMatch:s.wMatch, fMatch:s.fMatch};
  });
  scored.sort(function(a,b){return b.score-a.score;});

  // 상위 8개 중 랜덤 4개 뽑기 (다양성)
  var pool = scored.slice(0, Math.min(8+shuffleCount*2, scored.length));
  // 셔플
  for(var i=pool.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=pool[i];pool[i]=pool[j];pool[j]=t;}
  var picks = pool.slice(0,4);

  // 댓글
  document.getElementById('result-comment').style.borderColor = weatherState==='rainy'?'#3498db':
    weatherState==='snowy'?'#9b59b6':weatherState==='hot'?'#e74c3c':'#3498db';
  document.getElementById('result-comment-txt').innerHTML = getComment(weatherState, weatherTemp, fortuneData);

  // 태그
  var wNames={hot:'더움',mild:'선선',cold:'추움',rainy:'비',snowy:'눈',cloudy:'흐림'};
  document.getElementById('tag-weather').textContent = '🌤️ '+( wNames[weatherState]||'날씨');

  // 메뉴 카드
  var grid = document.getElementById('menu-grid');
  grid.innerHTML='';
  picks.forEach(function(p){
    var badge = getBadge(p.wMatch, p.fMatch);
    var why   = getWhy(p.menu, p.wMatch, p.fMatch, fTags);
    var card  = document.createElement('div');
    card.className='menu-card'+(p.wMatch&&p.fMatch?' highlight':'');
    card.innerHTML=
      '<span class="m-emoji">'+p.menu.emoji+'</span>'+
      '<div class="m-name">'+p.menu.name+'</div>'+
      '<div class="m-desc">'+p.menu.desc+'</div>'+
      '<div class="m-why">'+why+'</div>'+
      (badge?'<div class="m-badge '+badge.cls+'">'+badge.txt+'</div>':'');
    card.addEventListener('click',function(){
      document.querySelectorAll('.menu-card').forEach(function(c){c.classList.remove('picked');});
      card.classList.add('picked');
    });
    grid.appendChild(card);
  });

  document.getElementById('result-section').style.display='block';
}

function shuffle(){
  shuffleCount++;
  showResult();
}
function resetFortune(){
  fortuneData=null;
  document.getElementById('fortune-form').style.display='block';
  document.getElementById('fortune-result').style.display='none';
  document.getElementById('result-section').style.display='none';
  document.getElementById('birth-input').value='';
  shuffleCount=0;
}

// 키보드 엔터
document.getElementById('birth-input').addEventListener('keydown',function(e){
  if(e.key==='Enter') calcFortune();
});

// 시작
getLocation();
</script>
