// ── 날씨 코드 → 상태 매핑 (Open-Meteo WMO) ──
function getWeatherState(code, temp, isDay) {
  if (code === 0) return temp >= 25 ? 'hot' : temp >= 15 ? 'mild' : 'cold'; // 맑음
  if (code <= 3) return temp >= 25 ? 'hot' : temp >= 15 ? 'mild' : 'cold'; // 구름
  if (code <= 48) return 'cloudy'; // 안개
  if (code <= 67) return 'rainy';  // 비
  if (code <= 77) return 'snowy';  // 눈
  if (code <= 82) return 'rainy';  // 소나기
  if (code <= 86) return 'snowy';  // 눈 소나기
  return 'rainy'; // 뇌우
}

function getWeatherIcon(code, isDay) {
  if (code === 0) return isDay ? '☀️' : '🌙';
  if (code <= 2) return isDay ? '⛅' : '🌙';
  if (code === 3) return '☁️';
  if (code <= 48) return '🌫️';
  if (code <= 55) return '🌦️';
  if (code <= 67) return '🌧️';
  if (code <= 77) return '❄️';
  if (code <= 82) return '🌦️';
  if (code <= 86) return '🌨️';
  return '⛈️';
}

function getWeatherDesc(code, temp) {
  if (code === 0) return temp >= 30 ? '폭염' : temp >= 25 ? '맑고 더움' : temp >= 15 ? '맑음' : '맑고 추움';
  if (code <= 2) return '구름 조금';
  if (code === 3) return '흐림';
  if (code <= 48) return '안개';
  if (code <= 55) return '이슬비';
  if (code <= 67) return '비';
  if (code <= 77) return '눈';
  if (code <= 82) return '소나기';
  if (code <= 86) return '눈 소나기';
  return '뇌우';
}

    rainy: [
      `<strong>비 오는 날!</strong> 역시 파전에 막걸리... 아니면 얼큰한 국물 어떠세요? ☔`,
      `<strong>오늘은 우산 챙기세요!</strong> 비 오는 날엔 따뜻한 국물이 최고예요 🌧️`,
    ],
    snowy: [
      `<strong>눈이 내려요! ❄️</strong> 따뜻한 실내에서 뜨끈한 메뉴로 눈 구경해요`,
      `<strong>설경이 아름다운 날!</strong> 따뜻한 음식으로 온몸을 녹여봐요 ⛄`,
    ],
    cloudy: [
      `<strong>흐린 날씨 ${temp}°.</strong> 짜장면이 생각나는 날이에요! ☁️`,
      `<strong>구름 낀 날씨.</strong> 든든한 한 끼로 기분 전환 어때요? 🍽️`,
    ],
  };
  var arr = comments[state] || comments.mild;
  return arr[Math.floor(Math.random() * arr.length)];
}

// ── 현재 표시 중인 메뉴 ──
var currentMenus = [];
var currentState = 'mild';
var shuffleCount = 0;

function showMenus(state, count) {
  count = count || 4;
  var pool = (MENUS[state] || MENUS.mild).slice();
  // 섞기
  for (var i = pool.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = pool[i]; pool[i] = pool[j]; pool[j] = tmp;
  }
  currentMenus = pool.slice(0, count);
  var grid = document.getElementById('menu-grid');
  grid.innerHTML = '';
  currentMenus.forEach(function(m) {
    var card = document.createElement('div');
    card.className = 'menu-card';
    card.innerHTML =
      '<span class="m-emoji">' + m.emoji + '</span>' +
      '<div class="m-name">' + m.name + '</div>' +
      '<div class="m-desc">' + m.desc + '</div>' +
      '<div class="m-why">' + m.why + '</div>' +
      (m.badge ? '<div class="m-badge">' + m.badge + '</div>' : '');
    card.addEventListener('click', function() {
      document.querySelectorAll('.menu-card').forEach(function(c){ c.classList.remove('picked'); });
      card.classList.add('picked');
    });
    grid.appendChild(card);
  });
}

function shuffle() {
  shuffleCount++;
  showMenus(currentState);
  // 버튼 텍스트 변경
  var btn = document.getElementById('btn-shuffle');
  btn.textContent = '🎲 또 다른 메뉴 ('+shuffleCount+'번째)';
  setTimeout(function(){ btn.textContent = '🎲 다른 메뉴 추천받기'; }, 1500);
}

// ── 날씨 데이터 로드 ──
function loadWeather(lat, lon, locName) {
  var url = 'https://api.open-meteo.com/v1/forecast?latitude=' + lat +
    '&longitude=' + lon +
    '&current=temperature_2m,apparent_temperature,relative_humidity_2m,' +
    'weather_code,wind_speed_10m,cloud_cover,is_day' +
    '&timezone=Asia%2FSeoul&forecast_days=1';

  fetch(url)
    .then(function(r){ return r.json(); })
    .then(function(data) {
      var c = data.current;
      var temp = Math.round(c.temperature_2m);
      var feel = Math.round(c.apparent_temperature);
      var hum = c.relative_humidity_2m;
      var wind = (c.wind_speed_10m / 3.6).toFixed(1); // km/h → m/s
      var cloud = c.cloud_cover;
      var code = c.weather_code;
      var isDay = c.is_day;

      document.getElementById('w-loading').style.display = 'none';
      document.getElementById('w-main').style.display = 'block';
      document.getElementById('w-icon').textContent = getWeatherIcon(code, isDay);
      document.getElementById('w-temp').textContent = temp + '°';
      document.getElementById('w-feel').textContent = '체감 ' + feel + '°';
      document.getElementById('w-desc').textContent = getWeatherDesc(code, temp);
      document.getElementById('w-loc').textContent = '📍 ' + (locName || '현재 위치');
      document.getElementById('w-hum').textContent = hum + '%';
      document.getElementById('w-wind').textContent = wind + 'm/s';
      document.getElementById('w-cloud').textContent = cloud + '%';

      // 날씨 상태 결정
      currentState = getWeatherState(code, temp, isDay);

      // 날씨 멘트
      var comment = document.getElementById('w-comment');
      comment.style.display = 'block';
      document.getElementById('w-comment-txt').innerHTML = getWeatherComment(currentState, temp);

      // 메뉴 추천
      document.getElementById('menu-section').style.display = 'block';
      showMenus(currentState);

      // 동적 배경
      var bgMap = {
        hot: 'linear-gradient(135deg,#fff3e0,#ffe0b2)',
        mild: 'linear-gradient(135deg,#e8f5e9,#e3f2fd)',
        cold: 'linear-gradient(135deg,#e3f2fd,#e8eaf6)',
        rainy: 'linear-gradient(135deg,#eceff1,#e0e0e0)',
        snowy: 'linear-gradient(135deg,#e8eaf6,#f3e5f5)',
        cloudy: 'linear-gradient(135deg,#f5f5f5,#eceff1)',
      };
      document.body.style.background = bgMap[currentState] || bgMap.mild;
    })
    .catch(function() {
      showError();
    });
}

function showError() {
  document.getElementById('w-loading').style.display = 'none';
  document.getElementById('err').style.display = 'block';
}

function useDefaultLocation() {
  document.getElementById('err').style.display = 'none';
  document.getElementById('w-loading').style.display = 'block';
  loadWeather(37.5665, 126.9780, '서울');
}

function retryLocation() {
  document.getElementById('menu-section').style.display = 'none';
  document.getElementById('w-comment').style.display = 'none';
  document.getElementById('w-main').style.display = 'none';
  document.getElementById('w-loading').style.display = 'block';
  getLocation();
}

// ── 역지오코딩 (도시명 가져오기) ──
function getLocName(lat, lon, cb) {
  var url = 'https://nominatim.openstreetmap.org/reverse?lat=' + lat +
    '&lon=' + lon + '&format=json&accept-language=ko';
  fetch(url, {headers:{'User-Agent':'Jutopia/1.0'}})
    .then(function(r){ return r.json(); })
    .then(function(d) {
      var addr = d.address || {};
      var name = addr.city || addr.town || addr.county || addr.state || '';
      cb(name);
    })
    .catch(function(){ cb(''); });
}

function getLocation() {
  if (!navigator.geolocation) {
    useDefaultLocation(); return;
  }
  navigator.geolocation.getCurrentPosition(
    function(pos) {
      var lat = pos.coords.latitude;
      var lon = pos.coords.longitude;
      getLocName(lat, lon, function(name) {
        loadWeather(lat, lon, name);
      });
    },
    function() { showError(); },
    { timeout: 8000 }
  );
}

// 시작
getLocation();
</script>
